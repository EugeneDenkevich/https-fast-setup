server {
    listen 80;
    listen [::]:80;

    server_name some-domain.eug www.some-domain.eug;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot/;
    }

    location / {
        # THIS CONFIG IS ONLY FOR FIRST RUN, BEFORE SSL SERT GENERATING
        # proxy_pass http://host.docker.internal:8000/;
        # proxy_http_version 1.1;
        # proxy_set_header   Upgrade $http_upgrade;
        # proxy_set_header   Connection keep-alive;
        # proxy_set_header   Host $host;
        # proxy_cache_bypass $http_upgrade;
        # proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header   X-Forwarded-Proto $scheme;
        return 301 https://some-domain.eug$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    index index.html index.htm index.nginx-debian.html;
    root /var/www/some-domain.eug/html;

    server_name some-domain.eug;

    ssl_certificate     /etc/letsencrypt/live/some-domain.eug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/some-domain.eug/privkey.pem;

    location / {
        proxy_pass http://host.docker.internal:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt;
    }
}
