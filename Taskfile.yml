version: '3'

output: 'prefixed'

tasks:
  run:
    aliases:
      - r
    cmds:
      - >
        docker compose
        up
        --build
        -d
        {{.CLI_ARGS}}
        || exit 0
    desc: run docker compose
    interactive: true

  down:
    aliases:
      - d
    cmds:
      - >
        docker compose
        down
        --remove-orphans
        {{.CLI_ARGS}}
        || exit 0
    desc: stop docker compose
    interactive: true

  log:
    aliases:
      - l
    cmds:
      - >
        docker compose
        logs
        -f
        {{.CLI_ARGS}}
        || exit 0
    desc: show services' logs
    interactive: true

  set-domain:
    aliases:
      - sd
    cmds:
      - |
        cli_args={{.CLI_ARGS | shellQuote}}

        case "$cli_args" in
          "--domain "*) domain="${cli_args#--domain }" ;;
          --domain=*) domain="${cli_args#--domain=}" ;;
          ?*) domain="$cli_args" ;;
          *)
            echo "Usage: task sd -- [--domain] example.com" >&2
            exit 1
            ;;
        esac

        domain="${domain#https://}"
        domain="${domain#http://}"

        case "$domain" in
          ""|*[!A-Za-z0-9.-]*)
            echo "Domain may contain only letters, digits, dots, and hyphens." >&2
            exit 1
            ;;
        esac

        grep -rIlZ --exclude-dir=.git -- 'some-domain[.]eug' . |
          xargs -0 -r sed -i "s/some-domain[.]eug/$domain/g"
    desc: 'replace the project domain (usage: task sd -- [--domain] example.com)'

  switch-http:
    aliases:
      - sh
    cmds:
      - |
        sed -i -E '
          /listen 80;/,/^}/ {
            s/^([[:space:]]*)# (proxy_pass|proxy_http_version|proxy_set_header|proxy_cache_bypass)/\1\2/
            s/^([[:space:]]*)return 301 (https:\/\/[^$]*\$request_uri;)/\1# return 301 \2/
          }
        ' ./nginx/default.conf
    desc: enable proxying in the HTTP server block

  switch-https:
    aliases:
      - shs
    cmds:
      - |
        sed -i -E '
          /listen 80;/,/^}/ {
            s/^([[:space:]]*)(proxy_pass|proxy_http_version|proxy_set_header|proxy_cache_bypass)/\1# \2/
            s/^([[:space:]]*)# return 301 (https:\/\/[^$]*\$request_uri;)/\1return 301 \2/
            s/^([[:space:]]*)# (https:\/\/[^$]*\$request_uri;)/\1return 301 \2/
          }
        ' ./nginx/default.conf
    desc: enable the HTTPS redirect in the HTTP server block

  test-cert:
    aliases:
      - tc
    cmds:
      - >
        docker compose
        -f docker-compose.yml
        run
        --rm certbot
        certonly
        --webroot
        --webroot-path /var/www/certbot/
        --email eugenestudio@mail.ru
        --agree-tos
        --non-interactive
        --expand
        -d some-domain.eug
        -d www.some-domain.eug
        --dry-run
    desc: test cert generation

  cert:
    aliases:
      - c
    cmds:
      - >
        docker compose
        -f docker-compose.yml
        run
        --rm certbot
        certonly
        --webroot
        --webroot-path /var/www/certbot/
        --email eugenestudio@mail.ru
        --agree-tos
        --non-interactive
        --expand
        -d some-domain.eug
        -d www.some-domain.eug
    desc: cert generation

  cert-info:
    aliases:
      - ci
    cmds:
      - >
        docker compose
        exec
        -it nginx
        openssl x509
        -in /etc/letsencrypt/live/some-domain.eug/cert.pem
        -text
        -noout
    desc: get cert info
