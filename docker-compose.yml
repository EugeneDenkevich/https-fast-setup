services:
  nginx:
    image: nginx:1.31.7-perl
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www/:/var/www/certbot/:ro
      - ./nginx/certbot/conf/:/etc/letsencrypt/:ro
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - ./nginx/certbot/www/:/var/www/certbot/:rw
      - ./nginx/certbot/conf/:/etc/letsencrypt/:rw

  certbot-renew:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    depends_on:
      - nginx
    pid: "service:nginx"
    entrypoint: ["/bin/sh", "/scripts/certbot-renew.sh"]
    volumes:
      - ./nginx/certbot/www/:/var/www/certbot/:rw
      - ./nginx/certbot/conf/:/etc/letsencrypt/:rw
      - ./scripts/certbot-renew.sh:/scripts/certbot-renew.sh:ro
